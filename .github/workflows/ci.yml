name: CI

# Intégration continue (job « test ») puis déploiement continu (job « publish-image ») :
# après une CI verte sur dev ou main, l'image est publiée sur le registre de conteneurs
# GitHub (GHCR). La production la récupère : docker compose -f docker-compose.yml
# -f docker-compose.prod.yml pull && ... up -d

on:
  push:
    branches:
      - main
      - dev
      - micka2
      - "feature/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
      - dev
      - "refactor/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Installer les dépendances projet
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Installer outils CI
        run: |
         pip install pytest "ruff==0.16.9"

      - name: Vérifier la syntaxe Python
        run: python -m compileall .

      - name: Lint
        run: ruff check .github tests airflow
      
      - name: Créer le fichier .env CI
        run: echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > docker/.env

      - name: Build containers
        run: docker compose -f docker/docker-compose.yml build

      - name: Start containers
        run: docker compose -f docker/docker-compose.yml up -d

      - name: Wait for service
        run: |
          echo "Waiting for service..."
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7860 || true)
            if [ "$STATUS" = "200" ]; then
              echo "Service is up! (HTTP $STATUS)"
              exit 0
            fi
            echo "  attempt $i/20 — HTTP $STATUS"
            sleep 5
          done
          echo "Service failed to start"
          docker compose -f docker/docker-compose.yml logs alpr-engine --tail 50
          exit 1

      - name: Lancer les tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pytest -q

      - name: Stop containers
        if: always()
        run: docker compose -f docker/docker-compose.yml down

  # ───────────────────────────────────────────────────────────────────────────
  # Déploiement continu : publication de l'image validée (push sur dev ou main)
  # ───────────────────────────────────────────────────────────────────────────
  publish-image:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # jeton GitHub automatique : aucun secret à créer

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Libérer de l'espace disque (image PyTorch volumineuse)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes de l'image (branche + commit)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/alpr-engine
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
