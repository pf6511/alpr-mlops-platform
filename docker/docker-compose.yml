# ═══════════════════════════════════════════════════════════════════════════════
# ALPR Engine - Docker Compose (LEAD Edition)
# Stack complète: App + PostgreSQL + MLflow + MinIO (S3)
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# Configuration commune à l'application et au réentraînement automatique :
# même image, mêmes variables, mêmes volumes (un seul endroit à maintenir).
# ─────────────────────────────────────────────────────────────────────────────
x-alpr-common: &alpr-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: production
  image: alpr-engine:local
  restart: unless-stopped
  # Secrets (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, MLFLOW_TRACKING_TOKEN...) : docker/.env
  env_file:
    - path: .env
      required: false
  # Valeurs par défaut = stack locale (MinIO, MLflow local).
  # Pour le cloud, les surcharger dans docker/.env (S3_ENDPOINT vide = AWS S3).
  environment:
    - ENV=production
    - PYTHONPATH=/app
    - DB_MODE=postgres
    - DATABASE_URL=${DATABASE_URL}
    - STORAGE_MODE=${STORAGE_MODE:-s3}
    - S3_ENDPOINT=${S3_ENDPOINT-http://minio:9000}
    - S3_ACCESS_KEY=${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
    - S3_SECRET_KEY=${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
    - S3_BUCKET_CAPTURES=${S3_BUCKET_CAPTURES:-alpr-captures}
    - S3_BUCKET_DATASET=${S3_BUCKET_DATASET:-alpr-dataset}
    - S3_BUCKET_ARTIFACTS=${S3_BUCKET_ARTIFACTS:-mlflow}
    - S3_REGION=${S3_REGION:-us-east-1}
    - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    - MLFLOW_EXPERIMENT=${MLFLOW_EXPERIMENT:-alpr-brand-classifier}
    - MLFLOW_BRAND_MODEL=${MLFLOW_BRAND_MODEL:-vehicle_brand_model}
    - MODEL_BRAND_SOURCE=${MODEL_BRAND_SOURCE:-local}
    - RAY_MODE=local
    - GRADIO_SERVER_NAME=0.0.0.0
    - GRADIO_SERVER_PORT=7860
  volumes:
    - ../models:/app/models:ro
    - ../outputs:/app/outputs
    - alpr-data:/app/data
    # Code monté en lecture seule (développement : pas de rebuild à chaque modification)
    - ../src:/app/src:ro
    - ../configs:/app/configs:ro
    - ../pipelines:/app/pipelines:ro
    - ../app.py:/app/app.py:ro
  networks:
    - alpr-network

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # ALPR Engine (Application principale)
  # ─────────────────────────────────────────────────────────────────────────────
  alpr-engine:
    <<: *alpr-common
    container_name: alpr-engine
    ports:
      - "7860:7860"
    depends_on:
      # Facultatifs : inutiles quand S3 et MLflow sont dans le cloud
      minio:
        condition: service_started
        required: false
      mlflow:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────────
  # Réentraînement automatique du classificateur de marque
  # Un cycle toutes les continuous_training.interval_hours (configs/config.yaml) :
  # nouvelles images validées ? → entraînement → promotion. L'application charge
  # ensuite le nouveau champion d'elle-même.
  # Profil « mlops » : démarré explicitement, avec le registre configuré :
  #   docker compose --profile mlops up -d alpr-retrain
  # ─────────────────────────────────────────────────────────────────────────────
  alpr-retrain:
    <<: *alpr-common
    container_name: alpr-retrain
    profiles: ["mlops"]
    command: ["python", "-m", "src.mlops.continuous", "--loop"]
    depends_on:
      minio:
        condition: service_started
        required: false

  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL (Base de données)
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: alpr-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=alpr
      - POSTGRES_USER=alpr
      - POSTGRES_PASSWORD=${DB_PASSWORD:-alpr_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations/000_create_databases.sql:/docker-entrypoint-initdb.d/000_create_databases.sql:ro
      - ../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - alpr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpr -d alpr"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # MinIO (S3-compatible storage)
  # Images officielles minio/* retirées de Docker Hub → images Chainguard
  # ─────────────────────────────────────────────────────────────────────────────
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: alpr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - alpr-network

  # Créer les buckets au démarrage
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: alpr-minio-init
    restart: on-failure
    depends_on:
      - minio
    environment:
      - MC_CONFIG_DIR=/tmp/.mc
      - MC_HOST_myminio=http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@minio:9000
    command: ["mb", "--ignore-existing", "myminio/alpr-captures", "myminio/alpr-dataset", "myminio/mlflow"]
    networks:
      - alpr-network

  # ─────────────────────────────────────────────────────────────────────────────
  # MLflow (Tracking & Model Registry)
  # ─────────────────────────────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: alpr-mlflow
    restart: unless-stopped
    command: >
      bash -c "pip install --quiet psycopg2-binary boto3 &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://alpr:${DB_PASSWORD:-alpr_secret}@postgres:5432/mlflow
      --default-artifact-root s3://mlflow/"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - alpr-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Airflow (Orchestration - optionnel)
  # ─────────────────────────────────────────────────────────────────────────────
  airflow:
    image: apache/airflow:2.7.3-python3.10
    container_name: alpr-airflow
    restart: unless-stopped
    profiles:
      - full
    command: standalone
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://alpr:${DB_PASSWORD:-alpr_secret}@postgres:5432/airflow
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD:-admin}
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alpr-network

# ═══════════════════════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════════════════════

volumes:
  postgres-data:
  minio-data:
  alpr-data:
  airflow-logs:

# ═══════════════════════════════════════════════════════════════════════════════
# NETWORKS
# ═══════════════════════════════════════════════════════════════════════════════

networks:
  alpr-network:
    driver: bridge
